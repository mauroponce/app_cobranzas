name: app-cobranzas

x-php: &php
  build:
    context: .
    dockerfile: infra/docker/php/Dockerfile
  image: app-cobranzas-php:local
  working_dir: /var/www/html
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  env_file:
    - path: ./apps/backend/.env
      required: false
  environment:
    APP_ENV: local
    APP_URL: http://localhost:${APP_PORT:-8080}
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: ${DB_DATABASE:-app_cobranzas}
    DB_USERNAME: ${DB_USERNAME:-app_cobranzas}
    DB_PASSWORD: ${DB_PASSWORD:-change-me-for-local-development}
    REDIS_HOST: redis
    REDIS_CLIENT: predis
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    SESSION_DRIVER: database
    MAIL_MAILER: smtp
    MAIL_HOST: mailpit
    MAIL_PORT: 1025
    RESEND_API_KEY: ${RESEND_API_KEY:-}
    MAIL_FROM_ADDRESS: ${RESEND_FROM:-${MAIL_FROM:-}}
    MAIL_FROM_NAME: ${APP_NAME:-App Cobranzas}
    R2_ACCESS_KEY_ID: ${CLOUDFLARE_ACCESS_KEY_ID:-}
    R2_SECRET_ACCESS_KEY: ${CLOUDFLARE_SECRET_ACCESS_KEY:-}
    R2_BUCKET: ${CLOUDFLARE_R2_BUCKET:-${R2_BUCKET:-}}
    R2_ENDPOINT: ${CLOUDFLARE_R2_ENDPOINT:-}
  volumes:
    - ./apps/backend:/var/www/html
    - backend_vendor:/var/www/html/vendor
    - backend_assets:/var/www/html/public/build
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *php
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 15s
      timeout: 5s
      retries: 5
  nginx:
    image: nginx:1.27
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./apps/backend/public:/var/www/html/public:ro
      - backend_assets:/var/www/html/public/build:ro
      - ./infra/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--output", "/dev/null", "http://127.0.0.1/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_DATABASE:-app_cobranzas}
      POSTGRES_USER: ${DB_USERNAME:-app_cobranzas}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-for-local-development}
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-app_cobranzas} -d ${DB_DATABASE:-app_cobranzas}"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  queue:
    <<: *php
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90
    restart: unless-stopped
  scheduler:
    <<: *php
    command: php artisan schedule:work
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:${MAIL_PORT:-8025}:8025"
  assets:
    image: node:24-bookworm-slim
    working_dir: /var/www/html
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - ./apps/backend:/var/www/html
      - backend_assets:/var/www/html/public/build
    command: sh -c 'npm ci && npm run build'
    profiles: [tools]

volumes:
  postgres_data:
  redis_data:
  backend_vendor:
  backend_assets:
